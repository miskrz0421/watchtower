# Temporary example: desktop notifications for the fake listings website.
#
# Needs the optional extra:  uv sync --extra desktop
#
#   just serve                                                  # terminal 1
#   uv run watchtower check examples/config-desktop.yaml        # terminal 2: baseline
#   # edit examples/fake_listings/listings.json
#   uv run watchtower check examples/config-desktop.yaml        # terminal 2: notification
#
# Notification lifetime is controlled by the OS notification server, not by Watchtower.
# A one-shot `check` exits immediately, so the notification may vanish as soon as it appears.
# To keep Watchtower alive while notifications are shown, use:
#
#   just gui examples/config-desktop.yaml
#

# A separate database so this demo starts from its own baseline.
database: watchtower-desktop.db

watchers:
  - name: Cheap flats without agencies
    source:
      type: webpage
      url: "http://127.0.0.1:8000/listings"
      selector: ".offer"
      title_selector: ".title"
      price_selector: ".price"
      key_attribute: "data-id"
    interval: 30s
    diff: { type: items }
    filters:
      - new_items
      - price_below: 3000
      - not: { text_contains: agency }
    notify:
      - { type: discord, webhook_url: "https://discord.com/api/webhooks/1573656488751271996/LeAH8OVNMkBeGkQk5fIC0GXVxzJbt6DN1Oana0vh-x6m_6OtJaQw2AO-1IetDXO0clHr"}
