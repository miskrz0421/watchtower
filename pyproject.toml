# ---------------------------------------------------------------- the project

[project]
name = "watchtower"
version = "0.1.0"
description = "A plugin-based monitoring framework: watch anything, detect changes, filter what matters, react."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Bartłomiej Jucha" },
    { name = "Artur Sojka" },
    { name = "Michał Krzempek" },
]
requires-python = ">=3.12"
# Core dependencies only. The engine must run headless, so Qt and the
# analytics stack live in optional extras (see docs/decisions.md, ADR-003).
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

# What the app offers as commands; developer commands are recipes in the justfile (ADR-016).
[project.scripts]
watchtower = "watchtower.cli:main"
watchtower-fake-listings = "fake_listings.server:main"

# ---------------------------------------------------------------- optional dependencies

# For users: features that need more than the core.
[project.optional-dependencies]
gui = ["pyside6>=6.7"]
reports = ["pandas>=2.2", "matplotlib>=3.9"]
desktop = ["desktop-notifier>=6.2.0"]

# For developers: `uv sync` installs `dev`, which is all the other groups.
[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-qt>=4.4"]
lint = ["ruff>=0.6"]
types = ["mypy>=1.11", "pandas-stubs", "types-PyYAML"]
# pytest-qt, mypy and the tests of gui/ and reports/ need the extras (ADR-003).
extras = ["watchtower[desktop,gui,reports]"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
    { include-group = "extras" },
]

# ---------------------------------------------------------------- build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# fake_listings is the demo website; installing it gives it an entry point and
# lets the tests import it.
packages = ["src/watchtower", "examples/fake_listings"]

# Every tool below writes its caches and data to .artifacts/, so the project
# root holds only files that belong to the project (ADR-016).

# ---------------------------------------------------------------- tests and coverage

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that need PySide6 and a display (run with: uv run pytest -m gui)",
    "network: tests that hit a real local HTTP server",
]
cache_dir = ".artifacts/pytest"

[tool.coverage.run]
source = ["watchtower"]
data_file = ".artifacts/coverage/data"

[tool.coverage.report]
# Tests fail below this; raise it when coverage grows, never lower it.
fail_under = 95
# A stub waiting for its milestone is not code that tests could cover.
exclude_also = ["raise NotImplementedError"]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = ".artifacts/coverage/html"

# ---------------------------------------------------------------- lint and format

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100
cache-dir = ".artifacts/ruff"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify,
# D: every module, class and function has a docstring
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- types

[tool.mypy]
packages = ["watchtower"]
mypy_path = "src"
python_version = "3.12"
strict = true
cache_dir = ".artifacts/mypy"

[[tool.mypy.overrides]]
module = ["feedparser.*", "bs4.*"]
ignore_missing_imports = true
